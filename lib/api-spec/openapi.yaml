openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: results
    description: Secure patient result access
  - name: staff
    description: Laboratory staff result management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /results/verification/start:
    post:
      operationId: startResultVerification
      tags: [results]
      summary: Start secure result verification
      description: Starts a verification challenge without revealing whether a report exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultVerificationInput"
      responses:
        "202":
          description: Verification challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultVerificationChallenge"
        "400":
          description: Invalid verification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /results/verification/complete:
    post:
      operationId: completeResultVerification
      tags: [results]
      summary: Complete secure result verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultVerificationCompletionInput"
      responses:
        "200":
          description: Verification completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultVerificationCompletion"
        "401":
          description: Verification could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /results/me:
    get:
      operationId: getVerifiedResult
      tags: [results]
      summary: Get the verified patient's report
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedResult"
        "401":
          description: Verification token is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/session:
    post:
      operationId: createStaffSession
      tags: [staff]
      summary: Create a laboratory staff session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSessionInput"
      responses:
        "200":
          description: Staff session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "401":
          description: Invalid staff access code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/results:
    get:
      operationId: listStaffResults
      tags: [staff]
      summary: List reports for laboratory staff
      security:
        - staffBearerAuth: []
      responses:
        "200":
          description: Reports without medical result values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffResult"
        "401":
          description: Staff session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/results/{id}/status:
    patch:
      operationId: updateResultStatus
      tags: [staff]
      summary: Update a report readiness status
      security:
        - staffBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultStatusUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffResult"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Staff session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    staffBearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ResultStatus:
      type: string
      enum: [pending, ready, unavailable]
    ResultVerificationInput:
      type: object
      properties:
        analysisNumber:
          type: string
          minLength: 4
        dateOfBirth:
          type: string
          format: date
        phoneLast4:
          type: string
          pattern: "^[0-9]{4}$"
      required: [analysisNumber, dateOfBirth, phoneLast4]
    ResultVerificationChallenge:
      type: object
      properties:
        challengeId:
          type: string
        maskedPhone:
          type: string
        expiresInSeconds:
          type: integer
        demoCode:
          type: ["string", "null"]
      required: [challengeId, maskedPhone, expiresInSeconds, demoCode]
    ResultVerificationCompletionInput:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 10
        code:
          type: string
          minLength: 4
          maxLength: 8
      required: [challengeId, code]
    ResultVerificationCompletion:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResultStatus"
        accessToken:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
      required: [status, accessToken, expiresAt]
    ResultValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        unit:
          type: string
        referenceRange:
          type: string
      required: [name, value, unit, referenceRange]
    VerifiedResult:
      type: object
      properties:
        analysisNumber:
          type: string
        patientName:
          type: string
        sampleDate:
          type: string
          format: date
        approvedAt:
          type: ["string", "null"]
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResultValue"
      required: [analysisNumber, patientName, sampleDate, approvedAt, results]
    StaffResult:
      type: object
      properties:
        id:
          type: integer
        analysisNumber:
          type: string
        patientName:
          type: string
        sampleDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ResultStatus"
        updatedAt:
          type: string
          format: date-time
        canMarkReady:
          type: boolean
      required: [id, analysisNumber, patientName, sampleDate, status, updatedAt, canMarkReady]
    StaffSessionInput:
      type: object
      properties:
        staffId:
          type: string
          minLength: 2
        accessCode:
          type: string
          minLength: 6
      required: [staffId, accessCode]
    StaffSession:
      type: object
      properties:
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionToken, expiresAt]
    ResultStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResultStatus"
      required: [status]

